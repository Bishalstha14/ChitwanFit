<svg xmlns="http://www.w3.org/2000/svg" width="68" height="88" viewBox="-18.6 -3.6 67.2 87.2" role="img" aria-label="ChitwanFit logo — the Nepal flag holding the one-horned rhino of Chitwan">
  <!-- The official Nepal flag double pennant (crimson field, dark blue border) -->
  <path fill="#DC143C" stroke="#003893" stroke-width="4.6"
        stroke-linejoin="miter" d="M -15,37.5736 h 60 L -15,0 v 80 h 60 L -15,20 z"/>

  <!-- Crescent moon in the upper pennant (like the flag) -->
  <path fill="#FFFFFF" d="M -7.8,20.4 A 11,11 0 0,0 7.8,20.4 A 12.8,12.8 0 0,1 -7.8,20.4 z"/>

  <!-- Gold sun below the moon -->
  <circle cx="7.5" cy="37" r="6.2" fill="#FFE08A"/>

  <!-- One-horned rhino of Chitwan standing in the lower pennant -->
  <g fill="#F4EDE0" stroke="#F4EDE0" stroke-width="0.5" stroke-linejoin="round">
    <line x1="4.90" y1="64.97" x2="4.90" y2="75.08" stroke-width="4.48" stroke-linecap="round"/>
    <line x1="12.02" y1="65.89" x2="12.02" y2="75.39" stroke-width="3.78" stroke-linecap="round"/>
    <line x1="26.16" y1="65.89" x2="26.16" y2="74.77" stroke-width="3.78" stroke-linecap="round"/>
    <line x1="20.98" y1="65.59" x2="20.98" y2="75.08" stroke-width="4.18" stroke-linecap="round"/>
    <ellipse cx="38.21" cy="62.83" rx="1.79" ry="1.99"/>
    <path d="M -4.32,60.84 L -6.80,64.67" stroke-width="0.9"/>
    <ellipse cx="-6.21" cy="64.05" rx="1.79" ry="1.84"/>
    <path d="M 29.84,50.58 L 31.83,44.45 L 33.83,51.19 z"/>
    <path d="M 32.53,49.35 L 35.82,42.00 L 37.01,51.19 z"/>
    <ellipse cx="7.14" cy="57.16" rx="8.17" ry="8.73"/>
    <ellipse cx="16.10" cy="54.56" rx="8.96" ry="10.41"/>
    <ellipse cx="24.37" cy="56.24" rx="5.48" ry="9.65"/>
    <ellipse cx="31.04" cy="59.61" rx="6.47" ry="8.42"/>
  </g>
</svg>